# Learnamuse contact form Worker — see README.md for deploy steps.
name = "learnamuse-contact"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# Secrets (set with `npx wrangler secret put <NAME>`, never commit them):
#   BALE_BOT_TOKEN       primary: token of the Learnamuse Bale bot (ble.ir/LearnamuseBot)
#   BALE_CHAT_ID         admin channel/group id that receives messages (the bot's ADMIN_CHANNEL_ID;
#                        the bot must be a member/admin there)
#   TELEGRAM_BOT_TOKEN   optional secondary channel: bot token from @BotFather
#   TELEGRAM_CHAT_ID     optional: Telegram chat / group / channel id
#   TURNSTILE_SECRET     optional; when set a valid Turnstile token is required
# Every configured channel gets each message; the request succeeds if at least one delivery
# (or the optional KV/D1 archive) succeeds.
#
# Local-testing-only vars (leave unset in production):
#   BALE_API_BASE        default https://tapi.bale.ai
#   TELEGRAM_API_BASE    default https://api.telegram.org

[vars]
ALLOWED_ORIGINS = "https://learnamuse.com,https://www.learnamuse.com,https://learnamuse.github.io,http://localhost:3000"

# Per-IP rate limit (Workers Rate Limiting binding). period must be 10 or 60 seconds.
# namespace_id is any positive integer unique to this limiter within your account.
[[ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "41001"
simple = { limit = 5, period = 60 }

# --- Optional bindings (uncomment after creating the resources) ---
# Archive every message in KV (in addition to Bale/Telegram):
#   npx wrangler kv namespace create MESSAGES_KV
# [[kv_namespaces]]
# binding = "MESSAGES_KV"
# id = "<id>"
#
# Or archive in D1:
#   npx wrangler d1 create learnamuse-contact && npx wrangler d1 execute learnamuse-contact --remote --file=schema.sql
# [[d1_databases]]
# binding = "DB"
# database_name = "learnamuse-contact"
# database_id = "<id>"
#
# KV fixed-window rate limit fallback (only used when CONTACT_RATE_LIMITER is absent):
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<id>"
