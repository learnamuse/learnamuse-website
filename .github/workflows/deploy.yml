name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate content
        run: npm run validate

      # Outputs base_path ("" with a custom domain, "/learnamuse-website" on github.io)
      # and origin ("https://learnamuse.github.io" or "https://learnamuse.com").
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # WebP variants are generated by `prebuild`; reuse them across runs.
      # The manifest inside public/_img makes regeneration incremental on partial hits.
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: public/_img
          key: img-${{ hashFiles('public/images/**', 'scripts/optimize-images.mjs') }}
          restore-keys: img-

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Origin only — src/lib/url.ts appends NEXT_PUBLIC_BASE_PATH itself.
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
